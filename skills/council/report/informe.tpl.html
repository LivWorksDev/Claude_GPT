<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="light dark">
<title>Informe del consejo</title>
<style>
/* Acta de deliberación: cabecera con el sello del veredicto; pestañas por pregunta del lector
   (qué se decide, qué hacer, cómo se debatió, qué se objetó); columna de lectura de ~70ch y
   paneles de datos a todo el ancho. */
:root{
  color-scheme:light;
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E9EDF2; --ink:#172131; --ink-2:#2E3A4C; --muted:#5B6678; --rule:#D6DCE4;
  --accent:#1E3D6B;
  --seat-a:#5A3FCF; --seat-b:#B0245A; --seat-c:#2B394E; --on-strong:#FFFFFF;
  --ok:#21794A; --ok-bg:#E2F2E8; --warn:#9C5304; --warn-bg:#FAEBD5; --bad:#B02424; --bad-bg:#F8E0E0;
  --open:#1D5FB0; --open-bg:#E2ECF8; --neutral:#5D6777; --neutral-bg:#E6E9EE;
  --font-display:"Avenir Next Condensed","Avenir Next","Roboto Condensed","Arial Narrow","Segoe UI",system-ui,sans-serif;
  --font-body:Charter,"Bitstream Charter","Iowan Old Style","Sitka Text",Cambria,Georgia,serif;
  --font-ui:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E131A; --surface:#151C26; --surface-2:#1D2632; --ink:#E3E8EF; --ink-2:#C5CDD8; --muted:#97A2B2; --rule:#2A3543;
  --accent:#8EB2EE;
  --seat-a:#A796F6; --seat-b:#F1789F; --seat-c:#B9C5D6; --on-strong:#0E131A;
  --ok:#5DC98B; --ok-bg:#15301F; --warn:#F0A64C; --warn-bg:#382811; --bad:#F27D7D; --bad-bg:#3A1919;
  --open:#80B0F2; --open-bg:#14283F; --neutral:#A1AABA; --neutral-bg:#242D39;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E131A; --surface:#151C26; --surface-2:#1D2632; --ink:#E3E8EF; --ink-2:#C5CDD8; --muted:#97A2B2; --rule:#2A3543;
  --accent:#8EB2EE;
  --seat-a:#A796F6; --seat-b:#F1789F; --seat-c:#B9C5D6; --on-strong:#0E131A;
  --ok:#5DC98B; --ok-bg:#15301F; --warn:#F0A64C; --warn-bg:#382811; --bad:#F27D7D; --bad-bg:#3A1919;
  --open:#80B0F2; --open-bg:#14283F; --neutral:#A1AABA; --neutral-bg:#242D39;
}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.55 var(--font-ui)}
[hidden]{display:none!important}
img{max-width:100%}
a{color:var(--accent);text-underline-offset:2px}
a.ext,.path,.prose code{overflow-wrap:anywhere}
a.ext::after{content:"↗";font-size:.72em;margin-left:2px;vertical-align:.15em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow,.lbl{font:600 .72rem/1.3 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono)}

/* cabecera */
.mast{background:var(--surface);border-bottom:1px solid var(--rule)}
.mast-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 32px;align-items:center;padding-block:26px 20px}
.title{font-family:var(--font-display);font-weight:700;font-size:clamp(1.8rem,1.05rem + 2.7vw,3rem);line-height:1.04;letter-spacing:-.005em;margin:.35rem 0 .55rem;text-wrap:balance}
.thesis{font-family:var(--font-body);font-size:clamp(1.08rem,.98rem + .45vw,1.32rem);line-height:1.42;max-width:62ch;margin:0 0 .8rem;color:var(--ink-2)}
.hero-meta{font-size:.84rem;color:var(--muted);max-width:90ch;margin:0 0 .7rem}
.hero-meta code{font:600 .8rem var(--font-mono)}
.seats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.86rem;color:var(--ink-2)}
.seats span{display:inline-flex;align-items:center;gap:6px}
.seat{display:inline-grid;place-items:center;min-width:1.5em;height:1.5em;padding:0 .2em;border-radius:5px;font:700 .78rem/1 var(--font-mono);background:var(--seat-c);color:var(--on-strong)}
.seat[data-s="A"]{background:var(--seat-a)} .seat[data-s="B"]{background:var(--seat-b)}
.seat-name{font-weight:700;color:var(--seat-c)} .seat-name[data-s="A"]{color:var(--seat-a)} .seat-name[data-s="B"]{color:var(--seat-b)}
.stamp{justify-self:end;display:grid;justify-items:center;gap:3px;padding:12px 22px 10px;border:4px double currentColor;border-radius:6px;color:var(--ok);transform:rotate(-3.5deg);animation:stamp .5s cubic-bezier(.2,.9,.3,1.25) both;text-transform:uppercase;text-align:center}
.stamp b{font:700 2.05rem/1 var(--font-display);letter-spacing:.07em}
.stamp small{font:700 .7rem/1.25 var(--font-ui);letter-spacing:.1em}
.stamp.warn{color:var(--warn)} .stamp.neutral{color:var(--muted)}
@keyframes stamp{from{transform:rotate(-3.5deg) scale(1.2)}to{transform:rotate(-3.5deg) scale(1)}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}}
@media (max-width:720px){.mast-grid{grid-template-columns:1fr}.stamp{justify-self:start;transform:rotate(-2deg)}@keyframes stamp{from{transform:rotate(-2deg) scale(1.15)}to{transform:rotate(-2deg) scale(1)}}}

/* pestañas */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--rule)}
.tablist{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tablist::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:600 .92rem/1 var(--font-ui);padding:15px 12px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font:600 .7rem var(--font-mono);color:var(--muted);margin-left:5px}

main{padding-block:28px 64px}
.panel{display:grid;gap:44px}
.panel>section{min-width:0}
.sec-h{font:600 1.6rem/1.15 var(--font-display);margin:0 0 .35rem;text-wrap:balance}
.sec-sub{color:var(--muted);margin:0 0 1rem;font-size:.92rem;max-width:80ch}
section[id],h2[id],h3[id],.obj{scroll-margin-top:70px}

/* prosa */
.prose{overflow-wrap:break-word;font-family:var(--font-body);font-size:1.06rem;line-height:1.62;max-width:72ch;color:var(--ink)}
.prose p{margin:0 0 .85em}
.prose ul,.prose ol{margin:0 0 .9em;padding-left:1.35em}
.prose li{margin:.28em 0}
.prose li>ul,.prose li>ol{margin:.3em 0 .4em}
.prose h1{font:700 1.95rem/1.1 var(--font-display);margin:0 0 .6em;text-wrap:balance}
.prose h2{font:600 1.5rem/1.15 var(--font-display);margin:1.5em 0 .5em;text-wrap:balance}
.prose h3{font:700 1.1rem/1.3 var(--font-ui);margin:1.3em 0 .45em;text-wrap:balance}
.prose h4{font:700 .98rem/1.3 var(--font-ui);margin:1.1em 0 .4em}
.prose blockquote{margin:0 0 1em;padding:.15em 0 .15em 1em;border-left:3px solid var(--rule);color:var(--ink-2)}
.prose code{font:.84em var(--font-mono);background:var(--surface-2);padding:.08em .35em;border-radius:4px;overflow-wrap:anywhere}
.prose pre{background:var(--surface-2);padding:12px 14px;border-radius:6px;overflow-x:auto;font:.84rem/1.5 var(--font-mono);margin:0 0 1em}
.prose pre code{background:none;padding:0;font-size:inherit}
.prose hr{border:0;border-top:1px solid var(--rule);margin:1.5em 0}
.prose.sm{font-size:.96rem;line-height:1.55}
.prose.wide{max-width:none}
.prose.wide>p,.prose.wide>ul:not(.checklist),.prose.wide>ol{max-width:72ch}
.prose>:last-child{margin-bottom:0}
.path{font-family:var(--font-mono);font-size:.84em;color:var(--muted);border-bottom:1px dotted var(--muted);overflow-wrap:anywhere}
.tbl{overflow-x:auto;margin:0 0 1.1em;border:1px solid var(--rule);border-radius:8px;background:var(--surface);max-width:100%}
table{border-collapse:collapse;width:100%;font:.9rem/1.45 var(--font-ui)}
th,td{text-align:left;vertical-align:top;padding:8px 12px;border-bottom:1px solid var(--rule)}
th{font-weight:600;background:var(--surface-2);font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
tr:last-child td{border-bottom:0}

/* insignias y fichas */
.badge{display:inline-block;font:700 .66rem/1.55 var(--font-ui);letter-spacing:.05em;text-transform:uppercase;padding:0 .5em;border-radius:4px;vertical-align:.12em;white-space:nowrap;font-variant-numeric:tabular-nums}
.b-ok{color:var(--ok);background:var(--ok-bg)} .b-warn{color:var(--warn);background:var(--warn-bg)}
.b-bad{color:var(--bad);background:var(--bad-bg)} .b-open{color:var(--open);background:var(--open-bg)}
.b-neutral{color:var(--neutral);background:var(--neutral-bg)}
.chip{display:inline-flex;align-items:center;gap:5px;font:700 .78rem/1 var(--font-mono);padding:5px 8px;border:1px solid var(--rule);border-radius:999px;background:var(--surface);color:var(--seat-c);cursor:pointer;white-space:nowrap}
.chip[data-s="A"]{color:var(--seat-a)} .chip[data-s="B"]{color:var(--seat-b)}
.chip:hover{border-color:currentColor}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--neutral);flex:none}
.chip[data-sev="P1"] .dot{background:var(--bad)} .chip[data-sev="P2"] .dot{background:var(--warn)}
.chip::after{font:700 .74rem/1 var(--font-ui)}
.chip[data-disp="ACEPTADA"]::after{content:"✓";color:var(--ok)}
.chip[data-disp="RECHAZADA"]::after{content:"✕";color:var(--neutral)}
.chip[data-disp="ABIERTA"]::after{content:"○";color:var(--open)}
.chip.reopen{border-color:var(--warn);background:var(--warn-bg)}
.chip.reopen::before{content:"↺";color:var(--warn);font-family:var(--font-ui)}
.chip.pending{border-style:dashed;border-color:var(--warn)}
.chip.inline{padding:1px 6px;font-size:.8em;vertical-align:.04em;gap:4px}
.chip.inline::after{content:none}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px 18px}
.btn-link{appearance:none;border:0;background:none;padding:0;color:var(--accent);font:600 .86rem var(--font-ui);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.btn{appearance:none;border:1px solid var(--rule);background:var(--surface);color:var(--ink);font:600 .82rem/1 var(--font-ui);padding:7px 11px;border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--ink-2)}

/* resumen */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,215px),1fr));gap:12px}
.kpi{appearance:none;text-align:left;cursor:pointer;display:grid;gap:7px;align-content:start;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 16px 15px}
.kpi:hover{border-color:var(--ink-2)}
.kpi .val{font:700 2.1rem/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.kpi .val small{font:600 1rem var(--font-display);color:var(--muted);margin-left:4px}
.kpi .sub{font-size:.84rem;color:var(--muted);line-height:1.35}
.mbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2);gap:2px}
.mbar i{display:block;height:100%}
.c-ACEPTADA{background:var(--ok)} .c-RECHAZADA{background:var(--neutral)} .c-ABIERTA{background:var(--open)} .c-OTRA{background:var(--muted)}
.vgrid{display:grid;grid-auto-flow:column;grid-auto-columns:14px;gap:3px;align-items:center}
.vgrid i{display:block;height:11px;border-radius:3px;background:var(--surface-2)}
.vgrid i.APPROVED{background:var(--ok)} .vgrid i.REVISE{background:var(--warn)}
.lede>p:first-child{font-size:1.2rem;line-height:1.5}
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:12px;margin-top:4px}
.block{display:grid;grid-template-rows:auto auto 1fr auto;gap:8px;align-content:start;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.block .num{font:700 .74rem var(--font-mono);color:var(--muted);letter-spacing:.06em}
.block h3{font:700 1.02rem/1.28 var(--font-ui);margin:0;text-wrap:balance}
.block ul{margin:0;padding-left:1.1em;font-size:.88rem;color:var(--ink-2);line-height:1.45}
.block li{margin:.15em 0}
.block p{margin:0;font-size:.88rem;color:var(--ink-2)}
.discarded{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:10px;margin:.4rem 0 1rem}
.disc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
.disc .x{grid-row:span 2;width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;background:var(--neutral-bg);color:var(--neutral);font:700 .9rem var(--font-ui)}
.disc b{font:700 .94rem/1.3 var(--font-ui)}
.disc span{font:.92rem/1.45 var(--font-body);color:var(--ink-2)}
.pending-panel{background:var(--open-bg);border:1px solid var(--rule);border-radius:12px;padding:18px 20px}
.pending-panel .prose{max-width:80ch}
.dissent{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;margin-top:.6rem;align-items:start}
.dcard{display:grid;gap:10px;align-content:start;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;min-width:0}
.dcard>header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:600 .9rem var(--font-ui)}
.dcard p{margin:0;font:.95rem/1.5 var(--font-body);color:var(--ink-2)}
.dcard blockquote{margin:0;font:1rem/1.5 var(--font-body);color:var(--ink)}
.dcard blockquote p{font:inherit;color:inherit}
.dcard blockquote.risk{background:var(--warn-bg);padding:10px 12px;border-radius:8px}
.dcard .risk-l{display:block;font:700 .66rem/1.4 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--warn);margin-bottom:3px}

/* plan */
.gantt{--gl:9rem;display:grid;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:6px 18px 10px}
.g-axis{position:relative;height:40px;margin-left:calc(var(--gl) + 14px)}
.g-axis span{position:absolute;bottom:4px;transform:translateX(-50%);font:600 .7rem var(--font-mono);color:var(--muted);white-space:nowrap}
.g-axis span.today{color:var(--warn);bottom:auto;top:2px}
.g-row{display:grid;grid-template-columns:var(--gl) minmax(0,1fr);gap:4px 14px;padding:9px 0;border-top:1px solid var(--rule);align-items:start}
.g-date{font:700 .8rem/1.35 var(--font-mono);color:var(--ink);padding-top:2px}
.g-what{font:.94rem/1.42 var(--font-body);color:var(--ink-2);margin-bottom:7px}
.g-track{position:relative;height:10px;background:var(--surface-2);border-radius:5px}
.g-bar{position:absolute;top:0;bottom:0;border-radius:5px;background:var(--accent);min-width:6px}
.g-pt{position:absolute;top:50%;width:12px;height:12px;background:var(--accent);transform:translate(-50%,-50%) rotate(45deg);border-radius:2px}
.g-today{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--warn);border-radius:1px}
.g-row.past .g-bar,.g-row.past .g-pt{opacity:.45}
@media (max-width:640px){.gantt{padding-inline:14px}.g-row{grid-template-columns:minmax(0,1fr)}.g-axis{margin-left:0}}
.chart{width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:10px 6px 4px;overflow:hidden}
.chart svg{display:block}
.chart .ax{stroke:var(--rule);stroke-width:1}
.chart .axt{fill:var(--muted);font:500 11px var(--font-mono)}
.chart .ml{stroke:var(--accent);stroke-width:2.5;fill:none}
.chart .ma{fill:var(--accent);opacity:.08}
.chart .mp{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.chart .mv{fill:var(--ink);font:700 13px var(--font-ui)}
.chart .md{fill:var(--muted);font:600 11px var(--font-mono)}
.chart .thr{stroke:var(--bad);stroke-width:2.5}
.chart .thrt{fill:var(--bad);font:600 11px var(--font-ui)}
.chart .tdy{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:4 3}
.chart .tdyt{fill:var(--warn);font:700 11px var(--font-mono)}
.chart-cap{font-size:.84rem;color:var(--muted);margin:.5rem 2px 0}
.gates{display:grid;gap:0;background:var(--surface);border:1px solid var(--rule);border-radius:12px;margin-top:14px}
.gate{display:grid;grid-template-columns:8.5rem minmax(0,1fr);gap:4px 14px;padding:11px 16px;border-top:1px solid var(--rule)}
.gate:first-child{border-top:0}
.gate .d{font:700 .8rem/1.4 var(--font-mono)}
.gate b{font:700 .92rem var(--font-ui);margin-right:8px}
.gate span{font:.93rem/1.45 var(--font-body);color:var(--ink-2)}
@media (max-width:560px){.gate{grid-template-columns:minmax(0,1fr)}}
.risks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.risk{display:grid;gap:8px;align-content:start;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:13px 15px}
.risk .r{font:700 .95rem/1.32 var(--font-ui)}
.risk .m{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;font:.92rem/1.45 var(--font-body);color:var(--ink-2)}
.risk .m::before{content:"→";color:var(--ok);font:700 .95rem var(--font-ui)}
.checklist{list-style:none;padding-left:0!important}
.checklist li{position:relative;padding-left:1.7em}
.checklist li::before{content:"✓";position:absolute;left:0;top:.05em;width:1.25em;height:1.25em;border-radius:50%;display:grid;place-items:center;background:var(--ok-bg);color:var(--ok);font:700 .78rem/1 var(--font-ui)}
.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px;margin:.4rem 0 1.1rem;max-width:none}
.expc{display:grid;gap:6px;align-content:start;background:var(--surface);border:1px dashed var(--muted);border-radius:10px;padding:12px 14px;font-family:var(--font-ui)}
.expc b{font:700 .94rem/1.32 var(--font-ui)}
.expc span{font:.9rem/1.45 var(--font-body);color:var(--ink-2)}
.expc span.lbl{font:600 .68rem/1.3 var(--font-ui);letter-spacing:.08em;color:var(--open)}

/* debate */
.lane-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:12px;background:var(--surface)}
.lane{display:grid}
.lane>div{padding:11px 12px;border-top:1px solid var(--rule);border-left:1px solid var(--rule);min-width:0}
.lane>.lh{border-top:0;background:var(--surface-2);font:700 .72rem/1.35 var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lane>.lh a{font:600 .74rem var(--font-ui);text-transform:none;letter-spacing:0;display:inline-block;margin-top:2px}
.lane>.rowh{border-left:0;display:flex;gap:8px;align-items:center;font:700 .88rem var(--font-ui)}
.lane>.lh.rowh{border-left:0}
.cell{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
.cell .v{flex-basis:100%;margin-bottom:2px}
.cell .note{font-size:.8rem;color:var(--muted)}
.vbadge{display:inline-flex;align-items:center;gap:5px;font:700 .7rem/1 var(--font-ui);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:5px}
.vbadge.APPROVED{color:var(--ok);background:var(--ok-bg)} .vbadge.REVISE{color:var(--warn);background:var(--warn-bg)}
.vbadge.APPROVED::before{content:"✓"} .vbadge.REVISE::before{content:"✎"}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.82rem;color:var(--muted);margin-top:10px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.rounds{display:grid;gap:28px}
.round{display:grid;gap:12px}
.round-h{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.round-h h3{font:600 1.3rem/1.2 var(--font-display);margin:0}
.round-h .muted{font-size:.88rem}
.round-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}
.rcard{display:grid;gap:12px;align-content:start;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;min-width:0}
.rcard>header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:700 .92rem var(--font-ui)}
.rcard>header .vbadge{margin-left:auto}
.slist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.slist li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 9px;align-items:start}
.slist .t{font:.9rem/1.45 var(--font-body);color:var(--ink-2)}
.slist .t .badge{margin-right:5px}
.rcard blockquote.risk{margin:0;background:var(--warn-bg);padding:10px 12px;border-radius:8px;font:.93rem/1.5 var(--font-body)}
.rcard blockquote.risk .risk-l{display:block;font:700 .66rem/1.4 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--warn);margin-bottom:3px}
details>summary{cursor:pointer;font:600 .86rem var(--font-ui);color:var(--accent)}
details[open]>summary{margin-bottom:10px}
.subh{font:700 .72rem/1.3 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}

/* objeciones */
.sbars{display:grid;gap:10px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px 18px}
.sbar{display:grid;grid-template-columns:7.5rem minmax(0,1fr) 2.2rem;gap:12px;align-items:center}
.sbar .who{display:flex;gap:8px;align-items:center;font:700 .88rem var(--font-ui);white-space:nowrap}
.sbar .track{display:flex;gap:2px;height:28px}
.sbar .seg{appearance:none;border:0;border-radius:4px;color:var(--on-strong);font:700 .78rem/1 var(--font-mono);cursor:pointer;min-width:1.8rem;padding:0}
.sbar .seg:hover{filter:brightness(1.08)}
.sbar .tot{font:700 .9rem var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.filters{display:grid;gap:9px;margin:18px 0 12px}
.fg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fg .lbl{width:6.5rem}
.ft{appearance:none;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:5px 11px;font:600 .8rem/1 var(--font-ui);cursor:pointer;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.ft[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ft .n{font:600 .72rem var(--font-mono);opacity:.75}
.search{font:inherit;font-size:.92rem;padding:8px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink);width:min(100%,24rem)}
.count{font-size:.86rem;color:var(--muted);margin:0 0 10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.olist{display:grid;gap:10px}
.obj{display:grid;gap:7px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.obj-h{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.obj-id{font:700 .95rem var(--font-mono);color:var(--seat-c)}
.obj-id[data-s="A"]{color:var(--seat-a)} .obj-id[data-s="B"]{color:var(--seat-b)}
.obj-origin{font-size:.8rem;color:var(--muted);margin-left:auto}
.obj-title{font:700 1rem/1.32 var(--font-ui);margin:0;text-wrap:pretty}
.obj-why{margin:0;font:.95rem/1.5 var(--font-body);color:var(--ink-2)}
.obj-why .lbl{margin-right:6px}
.hist{list-style:none;margin:.7rem 0 0;padding:0 0 0 12px;display:grid;gap:7px;border-left:2px solid var(--rule)}
.hist li{font:.9rem/1.45 var(--font-body);color:var(--ink-2)}
.hist .ph{font:700 .7rem var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--rule);border-radius:10px}
dialog{border:1px solid var(--rule);border-radius:14px;padding:0;width:min(760px,calc(100vw - 32px));max-height:min(86vh,900px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(8,12,20,.5)}
.dlg-top{position:sticky;top:0;display:flex;justify-content:flex-end;padding:8px 8px 0;background:var(--surface)}
.dlg-body{padding:0 22px 22px}
.dlg-body .obj{border:0;padding:0;background:none}

/* estrategia */
.strat{display:grid;grid-template-columns:15rem minmax(0,1fr);gap:36px;align-items:start}
.toc{position:sticky;top:64px;max-height:calc(100vh - 84px);overflow:auto;display:grid;gap:2px;padding-right:6px}
.toc a{display:block;padding:4px 0;color:var(--muted);text-decoration:none;font:500 .86rem/1.3 var(--font-ui)}
.toc a:hover{color:var(--ink)}
.toc a.l3{padding-left:12px;font-size:.82rem}
.toc-m{display:none}
.stools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 0 18px;font-size:.88rem;color:var(--muted)}
details.sec{border-top:1px solid var(--rule);padding-top:.2em}
details.sec>summary{list-style:none;display:flex;gap:8px;align-items:baseline;color:var(--ink);margin:0}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";color:var(--muted);font:700 .9rem var(--font-ui);transition:transform .15s}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec>summary h3{margin:.7em 0 .5em}
@media (prefers-reduced-motion:reduce){details.sec>summary::before{transition:none}}
@media (max-width:900px){.strat{grid-template-columns:minmax(0,1fr)}.toc{display:none}.toc-m{display:block;margin-bottom:12px}.toc-m .toc{display:grid;position:static;max-height:none;margin-top:8px}}

/* documentos */
.docs{display:grid;grid-template-columns:16rem minmax(0,1fr);gap:32px;align-items:start}
.dnav{position:sticky;top:64px;max-height:calc(100vh - 84px);overflow:auto;display:grid;gap:14px;padding-right:6px}
.dgroup{display:grid;gap:1px}
.dgroup .lbl{margin:0 0 4px 8px}
.dbtn{appearance:none;display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px;font:500 .88rem/1.3 var(--font-ui);color:var(--ink-2);cursor:pointer}
.dbtn:hover{background:var(--surface-2)}
.dbtn[aria-current="true"]{background:var(--surface-2);color:var(--ink);font-weight:700}
.dbtn small{color:var(--muted);font:.72rem var(--font-mono);white-space:nowrap}
.dsel{display:none;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);width:100%;margin-bottom:14px}
.dview{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:22px 26px;min-width:0}
.dview-h{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
@media (max-width:900px){.docs{grid-template-columns:minmax(0,1fr)}.dnav{display:none}.dsel{display:block}.dview{padding:16px}}

/* proceso */
.seatcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.seatcard{display:grid;gap:6px;align-content:start;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.seatcard header{display:flex;gap:8px;align-items:center;font:700 1rem var(--font-ui)}
.seatcard .mono{font-size:.84rem}
.seatcard p{margin:0;font-size:.86rem;color:var(--muted)}
.hbars{display:grid;gap:14px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px 18px}
.hbar{display:grid;grid-template-columns:7rem minmax(0,1fr);gap:6px 12px;align-items:center}
.hbar .who{display:flex;gap:8px;align-items:center;font:700 .88rem var(--font-ui);white-space:nowrap}
.hbar .track{display:flex;height:22px;border-radius:4px;overflow:hidden}
.hbar .track i{display:block;height:100%}
.hbar .vals{grid-column:2;font:.8rem/1.4 var(--font-mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 14px}
.hbar .vals b{color:var(--ink);font-weight:700}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.sources{display:grid;gap:0;background:var(--surface);border:1px solid var(--rule);border-radius:12px}
.src{display:grid;grid-template-columns:3rem auto minmax(0,1fr);gap:4px 10px;padding:9px 14px;border-top:1px solid var(--rule);font-size:.88rem;align-items:baseline}
.src:first-child{border-top:0}
.src .id{font:700 .8rem var(--font-mono);color:var(--muted)}
.src .what{color:var(--ink-2);font-family:var(--font-body);min-width:0}
.src .what .path,.src .what a{display:block;font-size:.8rem;margin-bottom:1px;overflow-wrap:anywhere}
@media (max-width:560px){.src{grid-template-columns:3rem minmax(0,1fr)}.src .what{grid-column:1 / -1}}
.foot{border-top:1px solid var(--rule);color:var(--muted);font-size:.8rem;padding-block:18px 26px}
/* procedencia de la estrategia, estado del consejo y página sin JavaScript */
.stools .note-ok{color:var(--ok);font-weight:600}
.stools .note-warn{color:var(--warn);font-weight:600}
.integrity{display:inline-block;color:var(--bad);background:var(--bad-bg);border-radius:6px;padding:4px 10px;font-weight:700}
.st-card{display:grid;gap:10px}
.st-card>p{margin:0}
.st-card .reasons{margin:0;padding-left:1.2em;font:.92rem/1.45 var(--font-body);color:var(--ink-2)}
.noscript{padding-block:28px;font-family:var(--font-body);font-size:1.06rem;max-width:72ch}
@media print{.tabs,.dnav,.dsel,.toc,.toc-m{display:none!important}[role="tabpanel"][hidden]{display:grid!important}.stamp{animation:none}}

<script>

   mostrarlo, y las fechas en español de las tablas del informe. */

     abre en otra pestaña; una ruta relativa a un documento embebido navega dentro; cualquier
     otro esquema o una ruta absoluta queda como texto, nunca como href. */

  function isSep(l) { return /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l || ''); }

  function splitRow(r) {
    r = r.trim();
    if (r.charAt(0) === '|') r = r.slice(1);
    if (r.slice(-1) === '|' && r.slice(-2) !== '\\|') r = r.slice(0, -1);

  function docHash(p) {
    if (p === 'estrategia-final.md') return 'estrategia';
    if (p === 'registro.md') return 'objeciones';
    if (p === 'informe.md') return 'resumen';
    if (p === 'metadatos.md') return 'proceso';
    return 'doc~' + p.replace(/\//g, '~');
  }
  function resolve(base, u) {
    u = u.split('#')[0].replace(/:\d+(-\d+)?$/, '');
    var dir = base && base.indexOf('/') >= 0 ? base.slice(0, base.lastIndexOf('/') + 1) : '';
    var out = [];
    (dir + u).split('/').forEach(function (x) { if (x === '..') out.pop(); else if (x && x !== '.') out.push(x); });
    return out.join('/');

  function md(src, base, docs) {

    var i = 0, out = [], m;

        i++; out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue;
      }

          '</tr></thead><tbody>' + rows.map(function (r) { return '<tr>' + r.map(function (x) { return '<td>' + inline(x, base, docs) + '</td>'; }).join('') + '</tr>'; }).join('') +
          '</tbody></table></div>');
        continue;
      }
      if (RE_LIST.test(l)) { var r = parseList(lines, i, base, docs); out.push(r.html); i = r.next; continue; }
      var p = [];
      while (i < lines.length && lines[i].trim() && (p.length === 0 || !isBlockStart(lines[i], lines[i + 1]))) p.push(lines[i++].trim());

    }

  }
  function tables(src) {
    var lines = String(src == null ? '' : src).split('\n'), out = [], fence = false;

      var L = r.t.seat || 'C', s = r.s;
      return '<div class="hbar"><span class="who">' + (r.t.seat ? seatChip(r.t.seat) : '') + esc(r.t.seat ? seatLabel(r.t.seat) : r.t.name) + '</span>' +
        '<div class="track" style="width:' + (s.out / maxOut * 100).toFixed(2) + '%' + (r.t.lower ? ';outline:1.5px dashed var(--warn);outline-offset:2px' : '') + '">' +
        (s.reas ? '<i style="flex:' + s.reas + ';background:' + col(L, 55) + '" title="razonamiento: ' + fmtInt(s.reas) + '"></i>' : '') +
        '<i style="flex:' + Math.max(0, s.out - s.reas) + ';background:' + col(L, 100) + '"></i></div>' +
        '<div class="vals"><span><b>' + (r.t.lower ? '≥ ' : '') + fmtInt(s.out) + '</b>' + (r.t.lower ? ' (cota inferior: ' + esc(TK.sin_usage_definitivo) + ' de ' + esc(TK.mensajes) + ' mensajes sin usage definitivo)' : '') + '</span>' +
        (s.reas ? '<span><i class="sw" style="background:' + col(L, 55) + '"></i>razonamiento ' + fmtInt(s.reas) + '</span>' : '') + '</div></div>';
    }).join('');
    var unmeasured = TOK.filter(function (t) { return !t.measured; }).map(function (t) { return t.name; });
    out.push(sec('x-tokens', 'Tokens', 'Cada barra a escala dentro de su gráfico; las mismas sumas que <code>metadatos.md</code>.' + (unmeasured.length ? ' Sin medir: ' + esc(unmeasured.join(', ')) + '.' : ''),
      '<div class="two"><div><p class="subh" style="margin-bottom:8px">Entrada</p><div class="hbars">' + inH + '</div></div><div><p class="subh" style="margin-bottom:8px">Salida</p><div class="hbars">' + outH + '</div></div></div>'));
  }

  var astraL = letterOf('astra') || 'B';
  var turns = turnsAll.filter(function (t) { return t.inicio && t.fin && !isNaN(Date.parse(t.fin) - Date.parse(t.inicio)); });
  if (turns.length) {
    var mins = turns.map(function (t) { return Math.max(0, (Date.parse(t.fin) - Date.parse(t.inicio)) / 6e4); }), mx = Math.max.apply(null, mins.concat([0.1]));
    var tb = turns.map(function (t, i) {
      var lbl = /^round-(\d+)$/.test(t.fase) ? 'Ronda ' + t.fase.split('-')[1] : phaseLabel(t.fase);
      return '<div class="hbar"><span class="who" style="font-weight:600">' + esc(lbl) + (t.intento > 1 ? ' · a' + esc(t.intento) : '') + '</span><div class="track" style="width:' + (mins[i] / mx * 100).toFixed(2) + '%">' +
        '<i style="flex:1;background:' + (t.estado === 'done' ? 'var(--seat-' + esc(astraL.toLowerCase()) + ', var(--seat-b))' : 'var(--warn)') + '"></i></div>' +
        '<div class="vals"><span><b>' + fmtDec(mins[i], 1) + ' min</b></span><span>' + esc(t.target || '') + ' t' + esc(t.turno == null ? '-' : t.turno) + ' · ' + esc(t.tipo || '') + ' · ' + esc(t.estado) + (t.recuperado ? ' (recuperado)' : '') + '</span></div></div>';
    }).join('');
    var total = mins.reduce(function (a, b) { return a + b; }, 0);
    out.push(sec('x-turnos', 'Turnos de ' + seatLabel(astraL), fmtDec(total, 1) + ' minutos de cómputo en ' + turns.length + ' turnos, medidos por el wrapper. La duración de cada respuesta de Fable no se registra por fase.', '<div class="hbars">' + tb + '</div>'));
  }

  if (SOURCES.length) {
    var srcH = SOURCES.map(function (s) {
      var where = /^https?:\/\/\S+$/.test(s.src) ? extLink(s.src, esc(s.src.replace(/^https?:\/\/(www\.)?/, ''))) : '<span class="path">' + esc(s.src) + '</span>';
      return '<div class="src"><span class="id">' + esc(s.id) + '</span>' + badge(s.status) + '<span class="what">' + where + inline(s.desc, SRC.file || '') + '</span></div>';
    }).join('');
    out.push(sec('x-fuentes', 'Fuentes de la última auditoría', 'Las de la ' + docLink(SRC.file, String(SRC.file).replace('.md', '').replace('auditoria-v', 'auditoría v')) + ': las web consultadas de nuevo y las cifras del proyecto leídas en su fichero.', '<div class="sources">' + srcH + '</div>'));
  } else if (SRC.offline) {
    out.push(sec('x-fuentes', 'Fuentes de la última auditoría', '', '<div class="prose sm"><p>Run offline: la ' + docLink(SRC.file, String(SRC.file).replace('.md', '').replace('auditoria-v', 'auditoría v')) + ' dice <code>- OFFLINE: no aplica</code>, y toda cifra que no viene del usuario ni del proyecto queda como supuesto.</p></div>'));
  }
  out.push(sec('x-anom', 'Anomalías', '', '<div class="prose sm">' + (ANOM.length ? '<ul>' + ANOM.map(function (a) { return '<li>' + inline(a, 'metadatos.md') + '</li>'; }).join('') + '</ul>' : '<p><span class="badge b-ok">Ninguna</span> registrada en <code>metadatos.md</code>.</p>') + '</div>'));
  return out.join('');
}

/* ---------- navegación ---------- */
var TABS = [['resumen', 'Resumen'], ['plan', 'Plan'], ['debate', 'Debate'], ['objeciones', 'Objeciones', OBJS.length], ['estrategia', 'Estrategia'], ['documentos', 'Documentos', Object.keys(DOCS).length], ['proceso', 'Proceso']];
function show(tab) {
  TABS.forEach(function (t) {
    var b = document.getElementById('tab-' + t[0]), p = document.getElementById('panel-' + t[0]), on = t[0] === tab;
    b.setAttribute('aria-selected', on ? 'true' : 'false'); b.tabIndex = on ? 0 : -1; p.hidden = !on;
  });
  drawCharts();
}
function route() {
  var hs = '', tab = 'resumen', target = null;
  try { hs = decodeURIComponent(location.hash.slice(1)); } catch (e) { hs = ''; }
  if (TABS.some(function (t) { return t[0] === hs; })) tab = hs;
  else if (hs.indexOf('doc~') === 0) { tab = 'documentos'; showDoc(hs.slice(4).replace(/~/g, '/')); }
  else if (hs.indexOf('obj-') === 0) { tab = 'objeciones'; target = hs; }
  else if (hs.indexOf('est-') === 0) { tab = 'estrategia'; target = hs; }
  else if (/^(s|p|d|o|x)-|^ronda-/.test(hs)) { var el0 = document.getElementById(hs); var pn = el0 && el0.closest('[role="tabpanel"]'); if (pn) { tab = pn.id.replace('panel-', ''); target = hs; } }
  var wasHidden = document.getElementById('panel-' + tab).hidden;
  show(tab);
  if (tab === 'documentos' && !CUR_DOC) showDoc('brief.md');
  var el = target && document.getElementById(target);
  if (el) { var dt = el.closest('details'); if (dt) dt.open = true; el.scrollIntoView({ block: 'start' }); }
  else if (wasHidden) { var nav = document.querySelector('.tabs'); if (window.scrollY > nav.offsetTop) window.scrollTo(0, nav.offsetTop); }
}
function go(hashv) { if (location.hash.slice(1) === hashv) route(); else location.hash = hashv; }

function build() {
  if (!dataEl) {
    document.getElementById('app').innerHTML = '<div class="empty">Esta plantilla no lleva datos: la genera <code>council.sh report &lt;run-id&gt;</code>.</div>';
    return;
  }
  buildMast();
  var tl = document.getElementById('tablist'), app = document.getElementById('app');
  tl.innerHTML = TABS.map(function (t) {
    return '<button type="button" class="tab" role="tab" id="tab-' + t[0] + '" aria-controls="panel-' + t[0] + '" aria-selected="false" tabindex="-1">' + esc(t[1]) + (t[2] ? '<span class="n">' + t[2] + '</span>' : '') + '</button>';
  }).join('');
  var est = panelEstrategia();
  var builders = { resumen: panelResumen, plan: panelPlan, debate: panelDebate, objeciones: panelObjeciones, estrategia: function () { return est; }, documentos: panelDocumentos, proceso: panelProceso };
  app.innerHTML = TABS.map(function (t) { return '<div class="panel" role="tabpanel" id="panel-' + t[0] + '" aria-labelledby="tab-' + t[0] + '" hidden>' + builders[t[0]]() + '</div>'; }).join('');
  CHARTS = CHARTS.map(function (c) { return { el: document.querySelector(c.sel), fn: c.fn }; }).filter(function (c) { return c.el; });
  ['resumen', 'plan', 'debate', 'estrategia', 'proceso'].forEach(function (k) { enhance(document.getElementById('panel-' + k)); });
  enhance(document.getElementById('mast'));
  renderObjList();
  var gen = DATA.generated ? new Date(DATA.generated) : null;
  document.getElementById('foot').innerHTML = 'Generado por <code>council.sh report</code>' + (gen && !isNaN(gen) ? ' el ' + esc(gen.toLocaleString('es-ES', { dateStyle: 'long', timeStyle: 'short' })) : '') +
    ' a partir de los ficheros del run <code>' + esc(RUN.run_id || '') + '</code>. Es una vista derivada: si algo difiere, mandan los Markdown (<code>informe.md</code>, <code>estrategia-final.md</code>).';

  tl.addEventListener('click', function (e) { var b = e.target.closest('.tab'); if (b) go(b.id.replace('tab-', '')); });
  tl.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    var ids = TABS.map(function (t) { return t[0]; }), cur = ids.indexOf(document.activeElement.id.replace('tab-', ''));
    if (cur < 0) return;
    var nx = ids[(cur + (e.key === 'ArrowRight' ? 1 : ids.length - 1)) % ids.length];
    go(nx); document.getElementById('tab-' + nx).focus(); e.preventDefault();
  });
  var dlg = document.getElementById('objdlg');
  document.addEventListener('click', function (e) {
    var c = e.target.closest('[data-obj]');
    if (c) {
      e.preventDefault();
      var o = OBJ[c.dataset.obj]; if (!o) return;
      var body = document.getElementById('dlgbody'); body.innerHTML = objCard(o, true); enhance(body);
      if (!dlg.open) { if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', ''); }
      body.parentNode.scrollTop = 0; return;
    }
    var g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
    var dd = e.target.closest('.dbtn'); if (dd) { go('doc~' + dd.dataset.doc.replace(/\//g, '~')); return; }
    var ft = e.target.closest('.ft');
    if (ft) { var arr = F[ft.dataset.f], ix = arr.indexOf(ft.dataset.v); if (ix >= 0) arr.splice(ix, 1); else arr.push(ft.dataset.v); renderObjList(); return; }
    var sg = e.target.closest('[data-filter]');
    if (sg) { var pr = sg.dataset.filter.split('|'); F.seat = [pr[0]]; F.disp = [pr[1]]; F.sev = []; renderObjList(); document.getElementById('o-list').scrollIntoView({ block: 'start' }); return; }
    if (e.target.id === 'oreset') { F.seat = []; F.sev = []; F.disp = []; F.q = ''; document.getElementById('oq').value = ''; renderObjList(); return; }
    var fold = e.target.closest('[data-fold]');
    if (fold) { Array.prototype.forEach.call(document.querySelectorAll('#estdoc details.sec'), function (d) { d.open = fold.dataset.fold === '0'; }); return; }
    var a = e.target.closest('a[href^="#"]');
    if (a && dlg.open) dlg.close();
  });
  document.getElementById('dlgclose').addEventListener('click', function () { dlg.close(); });
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
  var oq = document.getElementById('oq');
  if (oq) oq.addEventListener('input', function () { F.q = oq.value; renderObjList(); });
  var ds = document.getElementById('dsel');
  if (ds) ds.addEventListener('change', function () { go('doc~' + ds.value.replace(/\//g, '~')); });
  window.addEventListener('hashchange', route);
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(drawCharts, 120); });
  route();
}
try { build(); } catch (err) {
  document.getElementById('app').innerHTML = '<div class="empty">No se pudo construir el informe: ' + esc(err && err.message || err) + '. Los documentos con autoridad son los Markdown de esta carpeta.</div>';
  throw err;
}
})();
</script>
